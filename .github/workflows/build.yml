name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The project has no Gradle wrapper, so install Gradle directly.
      # AGP 8.5.2 needs Gradle 8.7 or newer.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # The Android SDK is preinstalled on ubuntu-latest; this just accepts licenses
      # and makes sure the compileSdk 34 platform is present.
      - name: Prepare Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: OATbar-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
